{% extends 'base.html' %}{% block title %}Student registration{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="section-kicker">STUDENT ACCOUNT</span><h1>Join your campus loop</h1><p>Verify your college email to submit and track reports.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Full name<input name="name" autocomplete="name" required maxlength="100"></label><label>College email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="10" autocomplete="new-password" required><small>Use at least 10 characters.</small></label><button class="btn btn-dark full-btn">Send verification code</button></form><p>Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p></div></section>{% endblock %}
