{% extends 'base.html' %}{% block title %}Verify student email{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="section-kicker">EMAIL VERIFICATION</span><h1>Check your college inbox</h1><p>Enter the six digit code sent to {{ email }}. It expires in 10 minutes.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus></label><button class="btn btn-dark full-btn">Verify account</button></form><p><a href="{{ url_for('register') }}">Start again</a></p></div></section>{% endblock %}
